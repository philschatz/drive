<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches --md-sys-color-primary (light) / --md-sys-color-surface (dark). -->
    <meta name="theme-color" content="#415F91" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Collaborative document editor with offline support"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Automerge Documents</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Unregister stale service workers in dev mode
      if (location.hostname === 'localhost' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
    </script>
    <script type="module" src="./ui/main.tsx"></script>
  </body>
</html>
